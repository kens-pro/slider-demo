<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cool Slider Demo</title>

  <!-- Swiper CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />

  <style>
    /* === Reset & Layout === */
    *{box-sizing:border-box;margin:0;padding:0}
    body,html{height:100%;font-family:'Helvetica Neue',sans-serif;background:#000;color:#fff}

    /* === Slider area === */
    .hero-slider{width:100%;height:100vh}
    .swiper-slide img{width:100%;height:100%;object-fit:cover}

    /* キャプション（必要なら調整） */
    .caption{
      position:absolute;bottom:8%;left:5%;
      font-size:clamp(1rem,4vw,2rem);font-weight:bold;
      text-shadow:0 2px 8px rgba(0,0,0,.6)
    }

    /* ナビゲーション矢印 & ページネーション */
    .swiper-button-next,
    .swiper-button-prev{color:#fff}
    .swiper-pagination-bullet{background:rgba(255,255,255,.7);opacity:.7}
    .swiper-pagination-bullet-active{background:#fff;opacity:1}

    /* === キャプション（スマホでも見やすく）=== */
.caption{
  position:absolute;
  bottom:8%;
  left:5%;
  font-size:clamp(1rem, 4vw, 2.2rem);
  font-weight:bold;
  color:#fff;
  text-shadow:0 2px 8px rgba(0,0,0,.6);
  max-width:90%;
  line-height:1.4;
}

/* === 矢印サイズ調整（スマホで大きすぎないように）=== */
.swiper-button-next,
.swiper-button-prev{
  color:#fff;
  width: 32px;
  height: 32px;
}

/* === 追加のメディアクエリでスマホ最適化 === */
@media screen and (max-width: 768px) {
  .hero-slider {
    height: 85vh; /* スマホでは少し小さくする（必要に応じて） */
  }
  .caption {
    font-size:1.1rem;
    bottom:12%;
  }
}

.swiper-slide img {
  object-fit: cover;
  object-position: center;
  transform: scale(0.86); /* ← スマホ時に画像を少しだけ縮小！ */
}


.swiper-slide img {
    object-fit: cover;
    object-position: center 40%; /* ← ★ここが追加ポイント！ */
  }

  </style>
</head>
<body>

<!-- ===== Header Image Slider ===== -->
<div class="swiper hero-slider">
  <div class="swiper-wrapper">
    <!-- Slide-1 -->
    <div class="swiper-slide">
      <img src="public/001.png" alt="Concept Car 01">
      <div class="caption">心が躍る EV ライフへ</div>
    </div>

    <!-- Slide-2 -->
    <div class="swiper-slide">
      <img src="public/002.png" alt="Concept Car 02">
      <div class="caption">未来の都市を駆け抜けろ</div>
    </div>

    <!-- Slide-3 -->
    <div class="swiper-slide">
      <img src="public/003.png" alt="Concept Car 03">
      <div class="caption">自然と共に走るパワー</div>
    </div>
  </div>

  <!-- arrows & dots -->
  <div class="swiper-button-prev"></div>
  <div class="swiper-button-next"></div>
  <div class="swiper-pagination"></div>
</div>

<!-- Swiper JS -->
<script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>
<script>
  const heroSwiper = new Swiper('.hero-slider', {
    loop: true,
    speed: 900,
    autoplay: {
      delay: 5000,
      disableOnInteraction: false
    },
    effect: 'fade',
    pagination: {
      el: '.swiper-pagination',
      clickable: true
    },
    navigation: {
      nextEl: '.swiper-button-next',
      prevEl: '.swiper-button-prev'
    }
  });
</script>
</body>
</html>
